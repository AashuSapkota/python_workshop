{% extends "artists/base.html" %}

{% block content %}
<h2>{% if form.instance.pk %}Edit Artist{% else %}New Artist{% endif %}</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
</form>
<a href="{% url 'artist_list' %}">Cancel</a>
{% endblock %}
