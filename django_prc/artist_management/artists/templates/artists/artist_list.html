{% extends "artists/base.html" %}

{% block content %}
<h2>Artists</h2>
<a href="{% url 'artist_create' %}">Add New Artist</a>
<ul>
    {% for artist in artists %}
        <li>
            <a href="{% url 'artist_detail' artist.pk %}">{{ artist.name }}</a> 
            (<a href="{% url 'artist_update' artist.pk %}">Edit</a> | 
            <a href="{% url 'artist_delete' artist.pk %}">Delete</a>)
        </li>
    {% endfor %}
</ul>
{% endblock %}
